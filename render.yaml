services:
  - type: web
    name: kavach-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r api/requirements.txt
      pip install semgrep checkov GitPython
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port 10000

  - type: web
    name: kavach-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false